name: Android releasecontrole

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Android SDK installeren
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Tests, lint en ongetekende release
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintRelease :app:bundleRelease
      - name: Ongetekende bundle en R8-mapping bewaren
        uses: actions/upload-artifact@v4
        with:
          name: cryptora-unsigned-release
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
      - name: Rapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
